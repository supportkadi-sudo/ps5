name: Real Django PostgreSQL browser MVP
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'contracts/**', 'scripts/**', '.github/workflows/online.yml']
permissions:
  contents: read
jobs:
  online:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: club_e2e
          POSTGRES_USER: club
          POSTGRES_PASSWORD: disposable-e2e-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U club -d club_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      P2P_WEBHOOK_SECRET: synthetic-e2e-only-no-live-use
      P2P_UZCARD_SENDER_IDS: '900001'
      P2P_HUMO_SENDER_IDS: '900002'
      P2P_UZCARD_BUSINESS_CONNECTION_ID: synthetic-business
      P2P_HUMO_BUSINESS_CONNECTION_ID: synthetic-business
      DJANGO_SECRET_KEY: disposable-e2e-only-not-for-real-installations
      DJANGO_DEBUG: '1'
      POSTGRES_DB: club_e2e
      POSTGRES_USER: club
      POSTGRES_PASSWORD: disposable-e2e-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/manage.py migrate --noinput
      - run: python scripts/seed-e2e.py
      - name: Real browser sessions and PostgreSQL
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/club-api.log 2>&1 &
          cd frontend
          npx playwright test --config playwright.online.config.ts
      - name: Build same-origin web image
        run: docker build -t club-web-ci -f frontend/Dockerfile .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-browser-results
          path: |
            frontend/test-results
            /tmp/club-api.log
