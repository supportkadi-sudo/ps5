name: PostgreSQL cashier backend
on:
  pull_request:
    paths: ['backend/**', 'contracts/**', 'compose.yaml', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', 'compose.yaml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: club
          POSTGRES_USER: club
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U club -d club"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key-not-used-outside-isolated-tests
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ci-only-disposable-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py test tests --noinput -v 2
        working-directory: backend
      - run: git diff --check
