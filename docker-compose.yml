services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: club_crm
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${DB_PASSWORD:-club_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://club:${DB_PASSWORD:-club_password}@db:5432/club_crm
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
